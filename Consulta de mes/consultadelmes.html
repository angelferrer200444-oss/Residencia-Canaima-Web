<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#315b42">

    <title>Consulta de gastos | Residencia Canaima</title>

    <link rel="stylesheet" href="css/meses.css">
    <link rel="stylesheet" href="css/dark-mode.css">
    <script src="../theme.js"></script>
</head>
<body>

    <!-- Fondo Dinámico Natural (Hojas y Brisa de Canaima) -->
    <canvas id="natureCanvas" aria-hidden="true"></canvas>

    <main class="months-page" style="position:relative;z-index:1;">

        <header class="page-header">
            <p class="eyebrow">RESIDENCIA CANAIMA</p>
            <h1>Consulta de gastos</h1>
            <p class="subtitle">
                Selecciona un mes para consultar su relación de gastos.
            </p>
            <div class="title-line"></div>
        </header>

        <!-- SELECTOR DE AÑO -->
        <div class="months-toolbar">
            <div class="year-selector">

                <button
                    type="button"
                    class="year-arrow"
                    id="previous-year"
                    aria-label="Año anterior">
                    &#10094;
                </button>

                <span class="selected-year" id="selected-year">
                    2026
                </span>

                <button
                    type="button"
                    class="year-arrow"
                    id="next-year"
                    aria-label="Año siguiente">
                    &#10095;
                </button>

            </div>
        </div>

        <!-- MESES -->
        <section class="months-grid" id="months-grid" aria-label="Meses del año"></section>

        <footer class="page-footer">
            <p>Residencia Canaima · Relación de gastos</p>
        </footer>

    </main>

    <button class="theme-toggle" type="button"
        aria-label="Cambiar modo" title="Cambiar modo"></button>

    <script src="js/shared.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const { MESES, obtenerTipoValido, obtenerAnioValido } = window.CanaimaGastos;
            const parametros = new URLSearchParams(window.location.search);
            const tipo = obtenerTipoValido(parametros);
            let anioActual = obtenerAnioValido(parametros.get("anio"), 2026);

            const yearDisplay = document.getElementById("selected-year");
            const previousButton = document.getElementById("previous-year");
            const nextButton = document.getElementById("next-year");
            const monthsGrid = document.getElementById("months-grid");

            // Orden de gestión: febrero (01) hasta enero (12) del año siguiente
            const mesesOrden = [...MESES.slice(1), MESES[0]];

            if (monthsGrid) {
                monthsGrid.innerHTML = mesesOrden.map((mes, idx) => `
                    <a href="#" class="month-card" data-month="${mes.value}">
                        <span class="month-number">${String(idx + 1).padStart(2, "0")}</span>
                        <h2>${mes.label}</h2>
                        <span class="month-year"></span>
                        <span class="month-arrow"></span>
                    </a>
                `).join("");
            }

            const tarjetas = document.querySelectorAll(".month-card");

            function actualizarMeses() {
                yearDisplay.textContent = anioActual;

                tarjetas.forEach((card) => {
                    const mes = card.dataset.month;
                    // Enero pertenece al año siguiente.
                    const anioMes = mes === "enero" ? anioActual + 1 : anioActual;
                    card.querySelector(".month-year").textContent = anioMes;
                    card.href = `index.html?tipo=${tipo}&mes=${mes}&anio=${anioMes}`;
                });

                const nuevaURL = new URL(window.location.href);
                nuevaURL.searchParams.set("tipo", tipo);
                nuevaURL.searchParams.set("anio", anioActual);
                window.history.replaceState({}, "", nuevaURL);
            }

            previousButton.addEventListener("click", () => {
                anioActual--;
                actualizarMeses();
            });

            nextButton.addEventListener("click", () => {
                anioActual++;
                actualizarMeses();
            });

            actualizarMeses();
        });
    </script>
    <script src="../nature-leaves.js"></script>

</body>
</html>
