<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#315b42">

    <title>Consulta de gastos | Residencia Canaima</title>

    <link rel="stylesheet" href="css/meses.css">
    <link rel="stylesheet" href="css/dark-mode.css">
    <script src="js/dark-mode.js"></script>
</head>
<body>

    <main class="months-page">

        <header class="page-header">
            <p class="eyebrow">RESIDENCIA CANAIMA</p>
            <h1>Consulta de gastos</h1>
            <p class="subtitle">
                Selecciona un mes para consultar su relación de gastos.
            </p>
            <div class="title-line"></div>
        </header>

        <section class="months-grid" aria-label="Meses del año">

            <a href="#" class="month-card" data-month="febrero">
                <span class="month-number">01</span>
                <h2>Febrero</h2>
                <span class="month-arrow"></span>
            </a>

            <a href="#" class="month-card" data-month="marzo">
                <span class="month-number">02</span>
                <h2>Marzo</h2>
                <span class="month-arrow"></span>
            </a>

            <a href="#" class="month-card" data-month="abril">
                <span class="month-number">03</span>
                <h2>Abril</h2>
                <span class="month-arrow"></span>
            </a>

            <a href="#" class="month-card" data-month="mayo">
                <span class="month-number">04</span>
                <h2>Mayo</h2>
                <span class="month-arrow"></span>
            </a>

            <a href="#" class="month-card" data-month="junio">
                <span class="month-number">05</span>
                <h2>Junio</h2>
                <span class="month-arrow"></span>
            </a>

            <a href="#" class="month-card" data-month="julio">
                <span class="month-number">06</span>
                <h2>Julio</h2>
                <span class="month-arrow"></span>
            </a>

            <a href="#" class="month-card" data-month="agosto">
                <span class="month-number">07</span>
                <h2>Agosto</h2>
                <span class="month-arrow"></span>
            </a>

            <a href="#" class="month-card" data-month="septiembre">
                <span class="month-number">08</span>
                <h2>Septiembre</h2>
                <span class="month-arrow"></span>
            </a>

            <a href="#" class="month-card" data-month="octubre">
                <span class="month-number">09</span>
                <h2>Octubre</h2>
                <span class="month-arrow"></span>
            </a>

            <a href="#" class="month-card" data-month="noviembre">
                <span class="month-number">10</span>
                <h2>Noviembre</h2>
                <span class="month-arrow"></span>
            </a>

            <a href="#" class="month-card" data-month="diciembre">
                <span class="month-number">11</span>
                <h2>Diciembre</h2>
                <span class="month-arrow"></span>
            </a>

            <a href="#" class="month-card" data-month="enero">
                <span class="month-number">12</span>
                <h2>Enero</h2>
                <span class="month-arrow"></span>
            </a>

        </section>

        <footer class="page-footer">
            <p>Residencia Canaima · Relación de gastos</p>
        </footer>

    </main>

    <button class="theme-toggle" type="button"
        aria-label="Cambiar modo" title="Cambiar modo">
        <span class="theme-toggle-icon" aria-hidden="true">🌙</span>
    </button>

    <script>
        document.addEventListener("DOMContentLoaded", () => {

            const parametros = new URLSearchParams(window.location.search);

            let tipo = parametros.get("tipo") || "bolivares";

            const tiposPermitidos = ["bolivares", "divisas", "daru"];

            if (!tiposPermitidos.includes(tipo)) {
                tipo = "bolivares";
            }

            document.querySelectorAll(".month-card").forEach(card => {

                const mes = card.dataset.month;

                // Enero pertenece al año siguiente
                const anio = mes === "enero" ? "2027" : "2026";

                card.href =
                    `index.html?tipo=${tipo}&mes=${mes}&anio=${anio}`;

            });

        });
    </script>

</body>
</html>
