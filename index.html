<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Condominio Residencia Canaima</title>
    <!-- Preload Carousel Images (Iniciando por la primera para la animación de entrada) -->
    <link rel="preload" as="image" href="menu/imagenes/photo_2026-11-18_16-37-37.jpg">
    <link rel="preload" as="image" href="menu/imagenes/photo_2026-11-18_16-37-37%20(2).jpg">
    <link rel="preload" as="image" href="menu/imagenes/photo_2026-11-18_16-37-37%20(3).jpg">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="menu/style.css">
    <script src="theme.js"></script>
</head>
<body class="intro-active">
    <!-- Animación de Entrada Pantalla Completa ("Encaje Perfecto") -->
    <div class="intro-overlay" id="introOverlay" aria-hidden="true">
        <div class="intro-backdrop" id="introBackdrop">
            <!-- Carrusel de fondo en animación de aparición (Empieza con la primera imagen precargada) -->
            <div class="intro-carousel" id="introCarousel">
                <div class="intro-carousel-slide" id="introCarouselSlide" style="background-image: url('menu/imagenes/photo_2026-11-18_16-37-37.jpg');"></div>
                <div class="intro-carousel-overlay"></div>
            </div>
            <div class="intro-bg-shapes">
                <div class="intro-circle intro-circle-1"></div>
                <div class="intro-circle intro-circle-2"></div>
                <div class="intro-light-glow"></div>
            </div>
        </div>
        <div class="intro-content" id="introContent">
            <span class="intro-eyebrow">Condominio</span>
            <h1 class="intro-title">RESIDENCIA CANAIMA</h1>
            <div class="intro-shimmer-bar"></div>
        </div>
    </div>

    <!-- Fondo Dinámico Natural (Atmósfera y Brisa de Canaima) -->
    <div class="nature-bg-layer" aria-hidden="true">
        <div class="nature-ambient-orb orb-1"></div>
        <div class="nature-ambient-orb orb-2"></div>
        <div class="nature-ambient-orb orb-3"></div>
        <canvas id="natureCanvas" class="nature-canvas"></canvas>
    </div>

    <div class="app-container">
        <!-- Top Navigation Bar: Visitante a la izquierda, Modo Nocturno en la esquina derecha -->
        <header class="top-nav">
            <div class="nav-left">
                <!-- User Profile Button & Badge -->
                <button class="icon-btn dark-btn" id="userBtn" aria-label="Usuario" title="Perfil de usuario">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                        <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
                    </svg>
                </button>
                <div class="user-pill-badge" id="userBadge">
                    <span class="user-pill-name" id="userNameLabel">Visitante</span>
                </div>
            </div>

            <!-- Right Corner: Botón de Modo Nocturno / Diurno -->
            <div class="nav-right">
                <button class="icon-btn pink-btn theme-toggle-btn" id="themeToggleBtn" aria-label="Cambiar tema" title="Modo diurno / nocturno">
                    <!-- Sun / Rays Icon -->
                    <svg class="sun-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <!-- Moon Icon -->
                    <svg class="moon-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Main Hero Banner Section: Condominio RESIDENCIA CANAIMA (Tal como en el boceto) -->
        <section class="hero-wrapper">
            <div class="hero-card hero-card-centered" id="heroCard">
                <!-- Carrusel de Imágenes de Fondo (Ciclo de 3 segundos con fallback a fondo verde) -->
                <div class="hero-carousel" id="heroCarousel" aria-hidden="true">
                    <div class="hero-carousel-slide active" data-index="0" style="background-image: url('menu/imagenes/photo_2026-11-18_16-37-37.jpg');"></div>
                    <div class="hero-carousel-slide" data-index="1" style="background-image: url('menu/imagenes/photo_2026-11-18_16-37-37%20(2).jpg');"></div>
                    <div class="hero-carousel-slide" data-index="2" style="background-image: url('menu/imagenes/photo_2026-11-18_16-37-37%20(3).jpg');"></div>
                    <div class="hero-carousel-overlay"></div>
                </div>

                <!-- Background Decorative Circles -->
                <div class="hero-bg-shapes">
                    <div class="circle-decoration circle-1"></div>
                    <div class="circle-decoration circle-2"></div>
                </div>

                <!-- Central Content: Condominio RESIDENCIA CANAIMA -->
                <div class="hero-center-content">
                    <span class="hero-eyebrow">Condominio</span>
                    <h1 class="hero-main-title">RESIDENCIA CANAIMA</h1>
                </div>
            </div>
        </section>

        <!-- Bottom Grid Section (4 Columns) -->
        <main class="bottom-grid">
            <!-- 1. NOTICIAS (Carrusel con botones < y >) -->
            <section class="grid-col anime-scene-col">
                <div class="section-header">
                    <h2 class="section-title">Noticias</h2>
                </div>

                <!-- Carrusel de Noticias con botones laterales tal como en el boceto -->
                <div class="noticias-carousel-wrapper">
                    <button class="noticias-nav-btn prev-btn" id="noticiasPrevBtn" aria-label="Noticia anterior">
                        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="15 18 9 12 15 6"></polyline>
                        </svg>
                    </button>

                    <div class="noticias-viewport">
                        <div class="noticias-track" id="noticiasTrack">
                            <!-- Cards de noticias inyectadas/manejadas dinámicamente -->
                        </div>
                    </div>

                    <button class="noticias-nav-btn next-btn" id="noticiasNextBtn" aria-label="Siguiente noticia">
                        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </button>
                </div>

                <button class="view-more-btn" id="viewMoreBtn">Ver más</button>
            </section>

            <!-- 2. RELACIÓN GASTOS -->
            <section class="grid-col recent-search-col">
                <div class="section-header">
                    <h2 class="section-title">Relación Gastos</h2>
                </div>

                <div class="search-tags-list">
                    <!-- Bolívares -->
                    <a href="Consulta de mes/consultadelmes.html?tipo=bolivares" class="search-tag tag-dark">
                        <span>Bolívares</span>
                    </a>

                    <!-- Divisas -->
                    <a href="Consulta de mes/consultadelmes.html?tipo=divisas" class="search-tag tag-dark">
                        <span>Divisas</span>
                    </a>

                    <!-- DARU -->
                    <a href="Consulta de mes/consultadelmes.html?tipo=daru" class="search-tag tag-dark">
                        <span>DARU</span>
                    </a>

                    <!-- Botón Ajustable -->
                    <button class="search-tag tag-dark" id="btnAjustable" aria-label="Ajustes">
                        <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                        </svg>
                    </button>
                </div>
            </section>

            <!-- 3. ÁREAS COMUNES Y CANON DE LA COMUNIÓN -->
            <section class="grid-col stickers-col">
                <!-- Card 1: Áreas Comunes -->
                <div class="sticker-card sticker-top" id="cardAreasComunes">
                    <div class="sticker-placeholder">
                        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                            <polyline points="9 22 9 12 15 12 15 22"></polyline>
                        </svg>
                        <span class="sticker-label">Áreas Comunes</span>
                    </div>
                </div>

                <!-- Card 2: Canon de la Comunión -->
                <div class="sticker-card sticker-bottom" id="cardCanonComunion">
                    <div class="sticker-placeholder">
                        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                            <line x1="2" y1="10" x2="22" y2="10"></line>
                        </svg>
                        <span class="sticker-label">Canon de la Comunión</span>
                    </div>
                </div>
            </section>

            <!-- 4. NORMAS Y ACTA CONSTITUTIVA -->
            <section class="grid-col characters-col">
                <!-- Slot 1 (Carrusel): Norma del Trabajador / Cronograma Limpieza -->
                <div class="noticias-carousel-wrapper normas-carousel-wrapper">
                    <button class="noticias-nav-btn prev-btn" id="normasPrevBtn" aria-label="Documento anterior">
                        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="15 18 9 12 15 6"></polyline>
                        </svg>
                    </button>

                    <div class="noticias-viewport normas-viewport">
                        <div class="noticias-track normas-track" id="normasTrack">
                            <!-- Card 1A: Norma del Trabajador -->
                            <article class="character-card" id="btnNormasTrabajadores">
                                <div class="char-thumb placeholder-thumb">
                                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                        <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                                        <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                                    </svg>
                                </div>
                                <div class="char-info">
                                    <h3 class="char-name">Norma del Trabajador</h3>
                                </div>
                            </article>

                            <!-- Card 1B: Cronograma Limpieza -->
                            <a href="Cronograma/index.html" class="character-card doc-link-card" id="btnCronogramaLimpieza">
                                <div class="char-thumb placeholder-thumb">
                                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                                        <line x1="16" y1="2" x2="16" y2="6"></line>
                                        <line x1="8" y1="2" x2="8" y2="6"></line>
                                        <line x1="3" y1="10" x2="21" y2="10"></line>
                                        <path d="M9 16l2 2 4-4"></path>
                                    </svg>
                                </div>
                                <div class="char-info">
                                    <h3 class="char-name">Cronograma Limpieza</h3>
                                </div>
                            </a>
                        </div>
                    </div>

                    <button class="noticias-nav-btn next-btn" id="normasNextBtn" aria-label="Siguiente documento">
                        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </button>
                </div>

                <!-- Card 2: Norma de Convivencia -->
                <article class="character-card" id="btnNormasConvivencia">
                    <div class="char-thumb placeholder-thumb">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                        </svg>
                    </div>
                    <div class="char-info">
                        <h3 class="char-name">Norma de Convivencia</h3>
                    </div>
                </article>

                <!-- Card 3: Acta Constitutiva -->
                <a href="https://drive.google.com/drive/folders/1717KtFkWloFKUajHKLgeZjQhRU7keg05" target="_blank" rel="noopener noreferrer" class="character-card doc-link-card" id="btnActaConstitutiva">
                    <div class="char-thumb placeholder-thumb">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="16" y1="13" x2="8" y2="13"></line>
                        </svg>
                    </div>
                    <div class="char-info">
                        <h3 class="char-name">Acta Constitutiva</h3>
                    </div>
                </a>
            </section>
        </main>
    </div>

    <!-- Interactive Modal -->
    <div class="modal-overlay" id="infoModal">
        <div class="modal-card">
            <button class="modal-close-btn" id="modalCloseBtn" aria-label="Cerrar modal">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <div class="modal-header">
                <div class="modal-icon-badge" id="modalIcon"></div>
                <h3 class="modal-title" id="modalTitle">Título</h3>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer">
                <button class="pill-btn solid-pink-btn" id="modalActionBtn">Entendido</button>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div class="toast" id="toastMessage"></div>

    <script src="nature-leaves.js"></script>
    <script src="menu/script.js"></script>
</body>
</html>
