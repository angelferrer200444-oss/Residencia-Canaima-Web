<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="American Campers - wild life camping adventures">
    <title>Residencia Canaima</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Roboto+Slab:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <script src="animations.js" defer></script>
</head>
<body>
    <main>
        <section class="hero reveal-section" aria-labelledby="hero-title">
            <div class="hero-content">
                <p class="eyebrow">CONDOMINIO</p>
                <h1 id="hero-title">RESIDENCIA CANAIMA</h1>
                <div class="brush-line" aria-hidden="true"></div>
            </div>
            <div class="hero-brush" aria-hidden="true"></div>
        </section>

        <section class="philosophy reveal-section" id="about">
            <div class="section-inner">
                <h2>Relación de gastos</h2>

                <a href="consulta.html" class="button button-primary">
                    Consultar gastos
                </a>
            </div>
        </section>


        <section class="tours reveal-section" id="adventures">
            <div class="tours-brush" aria-hidden="true"></div>
            <div class="section-inner">
                <h2>Camping Tours</h2>
                <div class="tour-grid" id="gallery">
                    <a class="tour-card" href="#">
                        <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1000&q=85" alt="Hot spring in a national park">
                    </a>
                    <a class="tour-card" href="#">
                        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1000&q=85" alt="Red rock desert landscape">
                    </a>
                </div>
            </div>
        </section>

        <section class="adventure-types reveal-section" id="experiences">
            <div class="section-inner">
                <img class="section-cover-image" src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=2200&q=90" alt="Mountain range under a bright sky">
            </div>
        </section>

        <section class="benefits reveal-section">
            <div class="section-inner">
                <img class="section-cover-image" src="https://images.unsplash.com/photo-1473448912268-2022ce9509d8?auto=format&fit=crop&w=2200&q=90" alt="Sunlight passing through a green forest">
            </div>
        </section>

        <section class="testimonials reveal-section" id="testimonials">
            <div class="section-inner">
                <img class="section-cover-image" src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=2200&q=90" alt="Lake surrounded by mountains">
            </div>
        </section>

        <section class="contact reveal-section" id="contact">
            <div class="section-inner">
                <img class="section-cover-image" src="https://images.unsplash.com/photo-1478131143081-80f7f84ca84d?auto=format&fit=crop&w=2200&q=90" alt="Tent beside a calm lake at sunset">
            </div>
        </section>
    </main>

    <button class="scroll-hint" type="button" aria-label="Bajar por la página">
        <i class="fa-solid fa-arrow-down" aria-hidden="true"></i>
    </button>

</body>
</html>
